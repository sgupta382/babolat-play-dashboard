<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play Dashboard</title>
<meta name="description" content="Tennis stats from your Babolat Play racket: trends, speed, spin and milestones.">
<meta name="theme-color" content="#0e2a3b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Play">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#overview" aria-label="Play Dashboard home">
      <img src="icon.svg" alt="" width="32" height="32">
      <span>Play<span class="long"> Dashboard</span></span>
    </a>
    <span class="demo-badge" id="demoBadge" hidden></span>
    <div class="top-actions">
      <div class="seg" role="group" aria-label="Speed unit">
        <button type="button" data-unit="mph">mph</button>
        <button type="button" data-unit="kmh">km/h</button>
      </div>
      <button type="button" class="icon-btn" id="themeBtn" aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <a href="#overview" data-tab="overview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Overview</span></a>
    <a href="#trends" data-tab="trends"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg><span>Trends</span></a>
    <a href="#sessions" data-tab="sessions"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>Sessions</span></a>
    <a href="#milestones" data-tab="milestones"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg><span>Milestones</span></a>
  </nav>
</header>

<main id="view" tabindex="-1"></main>

<footer class="foot" id="foot"></footer>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">Share your milestone</h2>
    <img id="modalImg" alt="Milestone card">
    <p class="muted">Press and hold the image to save or share it, or download it below.</p>
    <div class="modal-actions">
      <a class="btn" id="modalDownload" download="milestone.png">Download PNG</a>
      <button type="button" class="btn ghost" id="modalClose">Close</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="charts.js"></script>
<script src="share.js"></script>
<script src="app.js"></script>
</body>
</html>
